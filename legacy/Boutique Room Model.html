<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boutique Room Model</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: full-bleed 3D viewport, one slim control strip floating over it. */
:root{
  --ink:#f4ede2;
  --ink-dim:#c9bfae;
  --panel:rgba(28,23,18,.74);
  --line:rgba(244,237,226,.2);
  --accent:#d8b47c;
  --bg:#2b2722;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;left:16px;right:16px;top:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;pointer-events:none}
.title{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);margin-right:4px}
.title b{display:block;font-weight:600;font-size:14px;letter-spacing:.01em}
.title span{font-size:12px;color:var(--ink-dim);font-variant-numeric:tabular-nums}
.chip{pointer-events:auto;cursor:pointer;font:600 13px/1 Manrope,system-ui,sans-serif;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:10px 14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.chip:hover{border-color:var(--accent)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip[aria-pressed="true"]{background:var(--accent);color:#241d14;border-color:var(--accent)}
.hint{position:fixed;left:16px;right:16px;bottom:14px;text-align:center;font-size:12px;color:var(--ink-dim);pointer-events:none;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.pad{position:fixed;right:16px;bottom:44px;display:none;gap:8px;align-items:flex-end;touch-action:none;user-select:none;-webkit-user-select:none}
.pad.on{display:flex}
.padcol{display:flex;flex-direction:column;gap:8px}
.padbtn{width:52px;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:600 20px/1 Manrope,system-ui,sans-serif;cursor:pointer;touch-action:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.padbtn:active{background:var(--accent);color:#241d14}
.padbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<canvas id="c" aria-label="Interactive 3D model of a boutique clothing store"></canvas>
<div class="hud">
  <div class="title"><b>Boutique room</b><span>about 7.0 × 9.0 × 3.2 m, estimated from the video</span></div>
  <button class="chip" id="b-walk" type="button">Walk in</button>
  <button class="chip" id="b-explore" type="button" aria-pressed="false">Explore</button>
  <button class="chip" id="b-dollhouse" type="button" aria-pressed="false">Dollhouse</button>
  <button class="chip" id="b-plan" type="button" aria-pressed="false">Plan</button>
  <button class="chip" id="b-ceiling" type="button" aria-pressed="true">Ceiling</button>
</div>
<div class="hint" id="hint"></div>
<div class="pad" id="pad" aria-label="Walking controls">
  <button type="button" class="padbtn" id="p-l" aria-label="Turn left">&#8592;</button>
  <div class="padcol"><button type="button" class="padbtn" id="p-f" aria-label="Walk forward">&#8593;</button><button type="button" class="padbtn" id="p-b" aria-label="Walk back">&#8595;</button></div>
  <button type="button" class="padbtn" id="p-r" aria-label="Turn right">&#8594;</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/exporters/GLTFExporter.js"></script>
<script>
(function(){
'use strict';
var THREE=window.THREE;

/* ---------- dimensions (metres) ---------- */
var W=7.0, D=9.0, H=3.2;           // interior: x -3.5..3.5, z -4.5..4.5, entrance on +z
var HW=W/2, HD=D/2;

/* ---------- renderer / scene ---------- */
var canvas=document.getElementById('c');
var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=.62;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

var scene=new THREE.Scene();
scene.background=new THREE.Color(0x5d626b);
var root=new THREE.Group(); root.name='Boutique'; scene.add(root);
var ceilingGroup=new THREE.Group(); ceilingGroup.name='Ceiling'; root.add(ceilingGroup);
var glowMeshes=[];

/* ---------- helpers ---------- */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
var R=rng(11);
function canvasTex(w,h,draw,rx,ry){
  var c=document.createElement('canvas');c.width=w;c.height=h;
  draw(c.getContext('2d'),w,h);
  var t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx||1,ry||1);
  t.encoding=THREE.sRGBEncoding;t.anisotropy=8;return t;
}
function std(color,rough,metal,o){
  return new THREE.MeshStandardMaterial(Object.assign({color:color,roughness:rough==null?.8:rough,metalness:metal||0},o||{}));
}
function mesh(geo,mat,x,y,z,parent,shadow){
  var m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);
  if(shadow!==false){m.castShadow=true;m.receiveShadow=true;}
  (parent||root).add(m);return m;
}
function box(w,h,d,mat,x,yBottom,z,parent){return mesh(new THREE.BoxGeometry(w,h,d),mat,x,yBottom+h/2,z,parent);}
function cyl(rt,rb,h,mat,x,yBottom,z,parent,seg){return mesh(new THREE.CylinderGeometry(rt,rb,h,seg||24),mat,x,yBottom+h/2,z,parent);}

/* ---------- textures ---------- */
var floorTex=canvasTex(512,512,function(g,w,h){
  g.fillStyle='#e7ddcc';g.fillRect(0,0,w,h);
  var r=rng(3);
  for(var i=0;i<2600;i++){g.fillStyle='rgba('+(r()<.5?'120,100,70':'255,250,240')+','+(0.02+r()*0.05)+')';g.fillRect(r()*w,r()*h,1+r()*3,1+r()*3);}
  g.lineCap='round';
  for(var k=0;k<9;k++){g.strokeStyle='rgba(150,130,100,'+(0.05+r()*0.08)+')';g.lineWidth=1+r()*2;g.beginPath();var x=r()*w,y=r()*h;g.moveTo(x,y);g.bezierCurveTo(x+r()*200-100,y+r()*200-100,x+r()*200-100,y+r()*200-100,x+r()*300-150,y+r()*300-150);g.stroke();}
  g.strokeStyle='#cbbfa8';g.lineWidth=4;g.strokeRect(0,0,w,h);
},W/1.2,D/1.2);
var woodTex=canvasTex(512,512,function(g,w,h){
  g.fillStyle='#a87d52';g.fillRect(0,0,w,h);
  var r=rng(5);
  for(var i=0;i<320;i++){var x=r()*w,lw=1+r()*3;g.fillStyle=r()<.5?'rgba(70,40,15,'+(0.05+r()*0.13)+')':'rgba(220,180,130,'+(0.04+r()*0.1)+')';g.fillRect(x,0,lw,h);}
  for(var j=1;j<4;j++){g.fillStyle='rgba(60,35,15,.35)';g.fillRect(j*128,0,2,h);}
});
var marbleTex=canvasTex(512,512,function(g,w,h){
  g.fillStyle='#f1eee8';g.fillRect(0,0,w,h);
  var r=rng(9);
  for(var k=0;k<16;k++){g.strokeStyle='rgba(125,120,112,'+(0.12+r()*0.2)+')';g.lineWidth=0.6+r()*1.8;g.beginPath();var x=r()*w,y=r()*h;g.moveTo(x,y);g.bezierCurveTo(x+r()*260-130,y+r()*260-130,x+r()*260-130,y+r()*260-130,x+r()*400-200,y+r()*400-200);g.stroke();}
});
var carpetTex=canvasTex(256,256,function(g,w,h){
  g.fillStyle='#d9cdb7';g.fillRect(0,0,w,h);
  var r=rng(2);
  for(var i=0;i<5000;i++){g.fillStyle='rgba('+(r()<.5?'160,140,110':'255,250,235')+','+(0.05+r()*0.1)+')';g.fillRect(r()*w,r()*h,1,1+r()*3);}
},3,3);
var glowTex=canvasTex(8,128,function(g,w,h){
  var gr=g.createLinearGradient(0,0,0,h);
  gr.addColorStop(0,'rgba(255,214,150,1)');gr.addColorStop(.35,'rgba(255,214,150,.35)');gr.addColorStop(1,'rgba(255,214,150,0)');
  g.fillStyle=gr;g.fillRect(0,0,w,h);
});

/* ---------- environment for soft reflections ---------- */
(function(){
  var pm=new THREE.PMREMGenerator(renderer);
  var es=new THREE.Scene();
  es.add(new THREE.Mesh(new THREE.BoxGeometry(12,6,14),new THREE.MeshBasicMaterial({color:0x7a6d5c,side:THREE.BackSide})));
  for(var i=0;i<5;i++){
    var p=new THREE.Mesh(new THREE.PlaneGeometry(2.4,.2),new THREE.MeshBasicMaterial({color:new THREE.Color(5,4.2,3.2),side:THREE.DoubleSide}));
    p.position.set(-4+i*2,2.9,-1+((i%2)*3));p.rotation.x=Math.PI/2;es.add(p);
  }
  scene.environment=pm.fromScene(es,0.04).texture;
})();

/* ---------- materials ---------- */
var M={
  wall:std(0xe4d8c4,.95,0,{envMapIntensity:.2}),
  ext:std(0xe2ded6,.95),
  ceil:std(0xeadfcc,.95,0,{envMapIntensity:.2}),
  wood:std(0xffffff,.55,0,{map:woodTex,envMapIntensity:.6}),
  brass:std(0xc4a26c,.32,.95,{envMapIntensity:1.1}),
  dark:std(0x252420,.45,.6,{envMapIntensity:.8}),
  marble:std(0xf1ece2,.22,0,{map:marbleTex,envMapIntensity:.5}),
  floor:std(0xf3ead8,.3,0,{map:floorTex,envMapIntensity:.4}),
  carpet:std(0xe6dac4,1,0,{map:carpetTex,envMapIntensity:.15}),
  glass:std(0xd3a468,.06,.1,{transparent:true,opacity:.3,side:THREE.DoubleSide,depthWrite:false,envMapIntensity:1.2}),
  glassFit:std(0xc9a679,.18,.1,{transparent:true,opacity:.42,side:THREE.DoubleSide,depthWrite:false,envMapIntensity:1}),
  mirror:std(0xd9d1c4,.04,1,{envMapIntensity:1.2}),
  black:std(0x161515,.4,.1),
  leather:std(0x1b1a19,.35,.05),
  boucle:std(0xe3d8c6,1,0,{side:THREE.DoubleSide}),
  taupe:std(0x9a8a76,.95,0,{side:THREE.DoubleSide}),
  white:std(0xf4f0e8,.6),
  stem:std(0x6f6a4a,.9),
  bloom:std(0xf4eadf,.9),
  lampBasic:new THREE.MeshBasicMaterial({color:0xfff1d6}),
  trimBasic:new THREE.MeshBasicMaterial({color:0xffe3b2}),
  pavement:std(0x8b8883,.95)
};
var glowMat=new THREE.MeshBasicMaterial({map:glowTex,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,opacity:.3});

/* ---------- shell ---------- */
function wallBox(w,h,d,x,yBottom,z,mats){
  var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mats);
  m.position.set(x,yBottom+h/2,z);m.castShadow=true;m.receiveShadow=true;root.add(m);return m;
}
var IN=M.wall, OUT=M.ext;
// order: +x,-x,+y,-y,+z,-z
wallBox(.2,H,D+.4,-HW-.1,0,0,[IN,OUT,OUT,OUT,OUT,OUT]);                 // left wall, inner face +x
wallBox(.2,H,D+.4, HW+.1,0,0,[OUT,IN,OUT,OUT,OUT,OUT]);                 // right wall, inner face -x
wallBox(W+.4,H,.2,0,0,-HD-.1,[OUT,OUT,OUT,OUT,IN,OUT]);                 // back wall, inner face +z
var OPEN=3.5, OPEN_H=2.7, sideW=(HW+.2-OPEN/2);
wallBox(sideW,H,.2,-(OPEN/2+sideW/2),0,HD+.1,[OUT,OUT,OUT,OUT,OUT,IN]);  // front wall, left of door
wallBox(sideW,H,.2, (OPEN/2+sideW/2),0,HD+.1,[OUT,OUT,OUT,OUT,OUT,IN]);  // front wall, right of door
wallBox(OPEN,H-OPEN_H,.2,0,OPEN_H,HD+.1,[OUT,OUT,OUT,OUT,OUT,IN]);       // lintel
// facade extension outdoors
var facade=new THREE.Group();facade.name='Facade';root.add(facade);
facade.add(wallBox(5,3.6,.2,-(HW+.2+2.5),0,HD+.1,[OUT,OUT,OUT,OUT,OUT,OUT]));
facade.add(wallBox(5,3.6,.2, (HW+.2+2.5),0,HD+.1,[OUT,OUT,OUT,OUT,OUT,OUT]));
// floor and pavement
var floor=mesh(new THREE.PlaneGeometry(W,D),M.floor,0,0,0);floor.rotation.x=-Math.PI/2;floor.castShadow=false;
var pave=mesh(new THREE.PlaneGeometry(40,24),M.pavement,0,-.005,HD+.2+12);pave.rotation.x=-Math.PI/2;pave.castShadow=false;
// ceiling
var ceil=mesh(new THREE.PlaneGeometry(W,D),M.ceil,0,H,0,ceilingGroup);ceil.rotation.x=Math.PI/2;ceil.castShadow=false;

/* ---------- cove soffits and glow washes ---------- */
function glowPlane(len,hgt,x,y,z,ry){
  var g=new THREE.Mesh(new THREE.PlaneGeometry(len,hgt),glowMat);
  g.position.set(x,y,z);g.rotation.y=ry;g.renderOrder=2;ceilingGroup.add(g);glowMeshes.push(g);return g;
}
// right and left wall soffits
box(.3,.22,D,M.wall,HW-.15,H-.22,0,ceilingGroup);
box(.3,.22,D,M.wall,-HW+.15,H-.22,0,ceilingGroup);
box(.02,.025,D-.1,M.trimBasic,HW-.31,H-.235,0,ceilingGroup);
box(.02,.025,D-.1,M.trimBasic,-HW+.31,H-.235,0,ceilingGroup);
glowPlane(D-.2,1.0,HW-.012,H-.22-.5,0,-Math.PI/2);
glowPlane(D-.2,1.0,-HW+.012,H-.22-.5,0,Math.PI/2);
// back niche soffit
box(2.6,.35,.3,M.wall,-.7,H-.35,-HD+.15,ceilingGroup);
box(2.6,.025,.02,M.trimBasic,-.7,H-.37,-HD+.31,ceilingGroup);
glowPlane(2.6,1.1,-.7,H-.35-.55,-HD+.012,0);

/* ---------- ceiling lights ---------- */
var zs=[3.4,2.1,.8,-.5,-1.8,-3.1];
[-2.15,0,2.15].forEach(function(x){
  zs.forEach(function(z,i){
    if(x!==0 && i%2===1) return;
    mesh(new THREE.CylinderGeometry(.075,.075,.012,20),M.white,x,H-.006,z,ceilingGroup,false);
    mesh(new THREE.CylinderGeometry(.052,.052,.014,20),M.lampBasic,x,H-.012,z,ceilingGroup,false);
  });
});
// smoke detector
mesh(new THREE.CylinderGeometry(.05,.05,.03,16),M.white,.35,H-.015,.2,ceilingGroup,false);
// track rails and spots
function track(x,z0,z1,alongZ,nSpots,yaw){
  var len=Math.abs(z1-z0), cz=(z0+z1)/2;
  var rail=mesh(new THREE.BoxGeometry(alongZ?.035:len,.03,alongZ?len:.035),M.black,alongZ?x:cz,H-.04,alongZ?cz:x,ceilingGroup,false);
  for(var i=0;i<nSpots;i++){
    var t=(i+.5)/nSpots, p=z0+(z1-z0)*t;
    var s=new THREE.Group();
    s.position.set(alongZ?x:p,H-.07,alongZ?p:x);
    var stem=mesh(new THREE.CylinderGeometry(.01,.01,.08,8),M.black,0,0,0,s,false);
    var can=mesh(new THREE.CylinderGeometry(.04,.034,.16,14),M.black,0,-.13,0,s,false);
    var lens=mesh(new THREE.CircleGeometry(.032,14),M.lampBasic,0,-.211,0,s,false);lens.rotation.x=Math.PI/2;
    s.rotation.z=(alongZ?(x>0?.45:-.45):0);s.rotation.x=(alongZ?0:-.5);
    ceilingGroup.add(s);
  }
}
track(-1.75,3.7,-1.9,true,6);
track(1.75,3.7,-1.9,true,6);
track(-3.55,-1.3,1.2,false,5);

/* ---------- lights ---------- */
scene.add(new THREE.HemisphereLight(0xffeccf,0x8a7355,.3));
[[0,2.9,2.6],[0,2.9,-1.0],[0,2.9,-3.4],[-2.2,2.9,.5],[2.2,2.9,.5],[-2.2,2.9,-2.5],[2.2,2.9,-2.5]].forEach(function(p){
  var l=new THREE.PointLight(0xffcf94,.28,8,2);l.position.set(p[0],p[1],p[2]);scene.add(l);
});
function spot(px,pz,tx,tz){
  var s=new THREE.SpotLight(0xffd9a6,.7,10,.7,.7,1.5);
  s.position.set(px,H-.1,pz);s.target.position.set(tx,.9,tz);
  s.castShadow=true;s.shadow.mapSize.set(1024,1024);s.shadow.bias=-.0006;s.shadow.radius=4;
  scene.add(s);scene.add(s.target);
}
spot(-1.6,1.0,-1.95,-.8);
spot(1.9,1.4,2.95,-.5);
spot(-.6,-2.6,-.6,-4.3);

/* ---------- entrance: glazing, frames, doors ---------- */
var DOORZ=HD+.1;
// frame around opening
box(.07,OPEN_H,.24,M.dark,-OPEN/2+.035,0,DOORZ);
box(.07,OPEN_H,.24,M.dark, OPEN/2-.035,0,DOORZ);
box(OPEN,.07,.24,M.dark,0,OPEN_H-.07,DOORZ);
// sidelights
[-1,1].forEach(function(s){
  var cx=s*(1.2+(OPEN/2-1.2)/2), w=OPEN/2-1.2-.07;
  mesh(new THREE.PlaneGeometry(w,OPEN_H-.14),M.glass,cx,(OPEN_H-.07)/2+.0,DOORZ,null,false);
  box(.05,OPEN_H-.14,.1,M.dark,s*1.2,.0,DOORZ);
  box(w+.1,.05,.1,M.dark,cx,0,DOORZ);
  box(w+.1,.05,.1,M.dark,cx,OPEN_H-.12,DOORZ);
});
var doors={};
function makeLeaf(side){
  var g=new THREE.Group(); var s=-side;               // leaf extends toward centre
  g.position.set(side*1.2,0,DOORZ+.02);
  var lw=1.2, lh=2.62;
  box(lw,.1,.06,M.dark,s*lw/2,0,0,g);
  box(lw,.1,.06,M.dark,s*lw/2,lh-.1,0,g);
  box(.07,lh,.06,M.dark,0,0,0,g);
  box(.07,lh,.06,M.dark,s*(lw-.035),0,0,g);
  box(.03,lh-.2,.02,M.dark,s*(lw*.5),.1,0,g);          // none; keeps frame visually busy-free
  g.children[g.children.length-1].visible=false;
  mesh(new THREE.PlaneGeometry(lw-.1,lh-.2),M.glass,s*lw/2,lh/2,0,g,false);
  // pull handle, both faces
  [.08,-.08].forEach(function(dz){
    var h=cyl(.013,.013,.5,M.brass,s*(lw-.12),.8,dz,g,12);
    cyl(.008,.008,.07,M.brass,s*(lw-.12),.9,dz/2,g,8).rotation.x=Math.PI/2;
  });
  root.add(g);return g;
}
doors.L=makeLeaf(-1); doors.R=makeLeaf(1);
var doorOpen=0;
function setDoors(a){
  doorOpen=a;var ang=a*Math.PI*.43;
  doors.L.rotation.y=-ang; doors.R.rotation.y=ang;
}

/* ---------- left wall: mirrors ---------- */
(function(){
  var x=-HW+.02, zc=[2.55,1.0,-.55];
  zc.forEach(function(z){
    mesh(new THREE.PlaneGeometry(1.35,2.7),M.mirror,x+.005,1.5,z,null,false).rotation.y=Math.PI/2;
    box(.04,2.8,.05,M.wood,x+.02,.1,z-.7);
    box(.04,2.8,.05,M.wood,x+.02,.1,z+.7);
    box(.04,.05,1.4,M.wood,x+.02,2.85,z);
    box(.04,.05,1.4,M.wood,x+.02,.1,z);
  });
})();

/* ---------- empty product slots ----------
   The brand supplies its own clothing, so none is modelled. Each rail, plinth and ledge
   gets a named empty node (Slot_*) at the place where product goes. A rail slot sits at the
   start of the hanging run; userData.axis is the direction the run extends and
   userData.length is its length in metres (negative means toward -z or -x). */
var slotsGroup=new THREE.Group();slotsGroup.name='ProductSlots';root.add(slotsGroup);
function anchor(name,x,y,z,len,axis){
  var g=new THREE.Group();g.name=name;
  if(axis==='z'){g.position.set(x,y,z);g.userData={axis:'z',length:len-z};}
  else if(axis==='x'){g.position.set(x,y,z);g.userData={axis:'x',length:len-x};}
  else{g.position.set(x,y,z);g.userData={axis:'floor'};}
  slotsGroup.add(g);return g;
}
function railZ(x,y,z0,z1){
  var r=mesh(new THREE.CylinderGeometry(.013,.013,Math.abs(z1-z0),12),M.brass,x,y,(z0+z1)/2);r.rotation.x=Math.PI/2;
}
function railX(z,y,x0,x1){
  var r=mesh(new THREE.CylinderGeometry(.013,.013,Math.abs(x1-x0),12),M.brass,(x0+x1)/2,y,z);r.rotation.z=Math.PI/2;
}
function pole(x,z,h,mat){box(.045,h,.045,mat||M.wood,x,0,z);}

/* ---------- racks ---------- */
// right wall run
(function(){
  var x=HW-.5;
  railZ(x,1.85,3.3,-3.4);
  [3.2,.3,-3.3].forEach(function(z){pole(x,z,H-.02);});
  anchor('Slot_Rail_RightWall_A',x,1.85,3.0,.6,'z');
  anchor('Slot_Rail_RightWall_B',x,1.85,.1,-3.0,'z');
  box(.6,.1,2.9,M.marble,x+.05,0,1.7);

});

/* ---------- camera, orbit view and walk mode ---------- */
var camera=new THREE.PerspectiveCamera(52,1,.05,120);
camera.rotation.order='YXZ';
var controls=new THREE.OrbitControls(camera,canvas);
controls.enableDamping=true;controls.dampingFactor=.08;
controls.minDistance=.3;controls.maxDistance=30;controls.maxPolarAngle=Math.PI*.98;
controls.screenSpacePanning=true;

var VIEWS={
  dollhouse:{pos:[7.2,9.0,9.4],tgt:[0,.5,-.4]},
  plan:{pos:[0,13.5,.05],tgt:[0,0,-.2]}
};
var mode='orbit';                    // 'orbit' | 'anim' | 'fp'
var anim=null;
var EYE=1.55;
var fp={x:0,z:3.5,yaw:0,pitch:-.03};
var keys={}, pad={f:0,b:0,l:0,r:0};
var hintEl=document.getElementById('hint'), padEl=document.getElementById('pad');
var HINT_ORBIT='Drag to orbit · scroll or pinch to zoom · right-drag to pan';
var HINT_FP='Drag to look · W A S D or arrow keys to walk · Shift to run · scroll to step';

// furniture the walker cannot pass through: [x, z, radius]
var OBST=[[.1,.55,.5],[.2,-1.1,.5],[1.0,-1.55,.45],[-1.85,-3.3,.45],[-2.55,-.15,.26],[2.3,-.05,.26],[-1.45,-2.0,.28]];
function allowed(x,z){
  var r=.22,i;
  for(i=0;i<OBST.length;i++){var o=OBST[i],dx=x-o[0],dz=z-o[1];if(dx*dx+dz*dz<(o[2]+r)*(o[2]+r))return false;}
  if(z<=4.35){
    if(Math.abs(x)>HW-.28||z<-HD+.28)return false;           // room walls
    if(x>1.4&&z<-2.7)return false;                            // fitting room
    if(x<-1.95&&z<-4.1)return false;                          // left back panel
    if(x>.5&&x<1.6&&z<-3.9)return false;                      // right back panel
    return true;
  }
  if(z<6.0)return Math.abs(x)<=.85;                           // through the door
  return Math.abs(x)<=14&&z<=14;                              // pavement outside
}
function markView(name){
  ['explore','dollhouse','plan'].forEach(function(n){document.getElementById('b-'+n).setAttribute('aria-pressed',n===name?'true':'false');});
}
function setCeiling(on){
  ceilingGroup.visible=on;
  document.getElementById('b-ceiling').setAttribute('aria-pressed',on?'true':'false');
}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function enterFP(x,z,yaw,pitch){
  mode='fp';anim=null;controls.enabled=false;
  fp.x=x;fp.z=z;fp.yaw=yaw||0;fp.pitch=pitch==null?-.03:pitch;
  if(!allowed(fp.x,fp.z)){fp.x=0;fp.z=3.5;}
  camera.position.set(fp.x,EYE,fp.z);camera.rotation.set(fp.pitch,fp.yaw,0,'YXZ');
  setCeiling(true);facade.visible=true;markView('explore');
  padEl.classList.add('on');hintEl.textContent=HINT_FP;
}
function enterFPFromCamera(){
  var d=new THREE.Vector3();camera.getWorldDirection(d);
  enterFP(camera.position.x,camera.position.z,Math.atan2(-d.x,-d.z),clamp(Math.asin(d.y),-1.1,1.1));
}
function enterOrbit(){
  mode='orbit';controls.enabled=true;padEl.classList.remove('on');hintEl.textContent=HINT_ORBIT;
}
function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;}
function goTo(name,instant){
  var v=VIEWS[name];if(!v)return;
  markView(name);setCeiling(false);facade.visible=false;enterOrbit();
  var p1=new THREE.Vector3().fromArray(v.pos),t1=new THREE.Vector3().fromArray(v.tgt);
  if(instant){camera.position.copy(p1);controls.target.copy(t1);controls.update();anim=null;return;}
  // when leaving walk mode, start the move from where the viewer looks now
  var d=new THREE.Vector3();camera.getWorldDirection(d);
  var t0=camera.position.clone().add(d.multiplyScalar(3));
  controls.target.copy(t0);
  anim={t:0,dur:1.4,p0:camera.position.clone(),t0:t0.clone(),p1:p1,t1:t1,doors:null,walk:false};
}
function walkIn(){
  markView('');setCeiling(true);facade.visible=true;
  mode='anim';controls.enabled=false;padEl.classList.remove('on');hintEl.textContent='Press any key or tap to take over';
  var p0=new THREE.Vector3(0,EYE,9.0),t0=new THREE.Vector3(0,1.4,-3.0);
  var p1=new THREE.Vector3(0,EYE,3.5),t1=new THREE.Vector3(0,1.35,-3.0);
  setDoors(0);camera.position.copy(p0);controls.target.copy(t0);
  anim={t:0,dur:6.5,p0:p0,t0:t0,p1:p1,t1:t1,doors:{from:.3,to:2.8},walk:true};
}
function finishWalk(){
  setDoors(1);
  if(anim&&anim.walk){camera.position.copy(anim.p1);controls.target.copy(anim.t1);controls.update();}
  anim=null;enterFPFromCamera();
}
function resize(){
  var w=window.innerWidth,h=window.innerHeight;
  renderer.setSize(w,h,false);camera.aspect=w/h;
  camera.fov=w/h<.9?72:52;camera.updateProjectionMatrix();
}
window.addEventListener('resize',resize);resize();

document.getElementById('b-walk').addEventListener('click',walkIn);
document.getElementById('b-explore').addEventListener('click',function(){
  if(mode==='fp')return;
  setDoors(1);anim=null;enterFP(0,3.5,0,-.03);
});
['dollhouse','plan'].forEach(function(n){
  document.getElementById('b-'+n).addEventListener('click',function(){setDoors(1);goTo(n,false);});
});
document.getElementById('b-ceiling').addEventListener('click',function(){setCeiling(!ceilingGroup.visible);});

/* look: drag; move: keys, buttons, wheel */
var drag=null;
canvas.addEventListener('pointerdown',function(e){
  if(mode==='anim'){finishWalk();return;}
  if(mode!=='fp')return;
  drag={x:e.clientX,y:e.clientY};
  try{canvas.setPointerCapture(e.pointerId);}catch(_){}
});
canvas.addEventListener('pointermove',function(e){
  if(!drag||mode!=='fp')return;
  fp.yaw-=(e.clientX-drag.x)*.0035;
  fp.pitch=clamp(fp.pitch-(e.clientY-drag.y)*.0035,-1.2,1.2);
  drag.x=e.clientX;drag.y=e.clientY;
});
function endDrag(){drag=null;}
canvas.addEventListener('pointerup',endDrag);canvas.addEventListener('pointercancel',endDrag);
canvas.addEventListener('wheel',function(e){
  if(mode!=='fp')return;e.preventDefault();
  stepBy(-clamp(e.deltaY,-120,120)*.004,0);
},{passive:false});
function keyName(e){return e.key.length===1?e.key.toLowerCase():e.key;}
window.addEventListener('keydown',function(e){
  if(mode==='anim'){finishWalk();return;}
  if(mode!=='fp')return;
  var k=keyName(e);
  if('wasdShift'.indexOf(k)>=0||k.indexOf('Arrow')===0){keys[k]=true;if(k.indexOf('Arrow')===0)e.preventDefault();}
});
window.addEventListener('keyup',function(e){keys[keyName(e)]=false;});
window.addEventListener('blur',function(){keys={};pad={f:0,b:0,l:0,r:0};});
[['p-f','f'],['p-b','b'],['p-l','l'],['p-r','r']].forEach(function(p){
  var el=document.getElementById(p[0]);
  el.addEventListener('pointerdown',function(e){pad[p[1]]=1;try{el.setPointerCapture(e.pointerId);}catch(_){}});
  ['pointerup','pointercancel','pointerleave'].forEach(function(ev){el.addEventListener(ev,function(){pad[p[1]]=0;});});
});
function stepBy(f,s){
  var sin=Math.sin(fp.yaw),cos=Math.cos(fp.yaw);
  var nx=fp.x+(-sin*f+cos*s),nz=fp.z+(-cos*f-sin*s);
  if(allowed(nx,nz)){fp.x=nx;fp.z=nz;}else if(allowed(nx,fp.z)){fp.x=nx;}else if(allowed(fp.x,nz)){fp.z=nz;}
}
function stepFP(dt){
  var f=((keys.w||keys.ArrowUp||pad.f)?1:0)-((keys.s||keys.ArrowDown||pad.b)?1:0);
  var s=(keys.d?1:0)-(keys.a?1:0);
  var turn=((keys.ArrowLeft||pad.l)?1:0)-((keys.ArrowRight||pad.r)?1:0);
  fp.yaw+=turn*1.7*dt;
  if(f||s){var sp=(keys.Shift?2.8:1.4)*dt;stepBy(f*sp,s*sp);}
  camera.position.set(fp.x,EYE,fp.z);
  camera.rotation.set(fp.pitch,fp.yaw,0,'YXZ');
}

var clock=new THREE.Clock();
function frame(){
  var dt=Math.min(clock.getDelta(),.05);
  if(mode==='fp'){
    stepFP(dt);
  }else{
    if(anim){
      anim.t+=dt;var k=Math.min(anim.t/anim.dur,1),e=ease(k);
      camera.position.lerpVectors(anim.p0,anim.p1,e);
      controls.target.lerpVectors(anim.t0,anim.t1,e);
      if(anim.doors){var d=anim.doors,dk=Math.min(Math.max((anim.t-d.from)/(d.to-d.from),0),1);setDoors(ease(dk));}
      if(k>=1){var w=anim.walk;anim=null;if(w){setDoors(1);controls.update();enterFPFromCamera();}}
    }
    controls.update();
  }
  renderer.render(scene,camera);
  window.__frames=(window.__frames||0)+1;
  requestAnimationFrame(frame);
}

/* ---------- test and export hooks ---------- */
window.__api={
  view:function(n){setDoors(1);if(n==='entrance'){enterFP(0,3.5,0,-.03);}else{goTo(n,true);}},
  cam:function(p,t,ceil){enterOrbit();facade.visible=ceil!==false;setDoors(1);setCeiling(ceil!==false);camera.position.fromArray(p);controls.target.fromArray(t);controls.update();},
  fp:function(x,z,yaw,pitch){setDoors(1);enterFP(x,z,yaw,pitch);},
  state:function(){return {mode:mode,x:fp.x,z:fp.z,yaw:fp.yaw};},
  exportGLB:function(){
    return new Promise(function(res,rej){
      var vis=[];glowMeshes.forEach(function(m){vis.push(m.visible);m.visible=false;});
      var prev=ceilingGroup.visible;ceilingGroup.visible=true;
      new THREE.GLTFExporter().parse(root,function(buf){
        glowMeshes.forEach(function(m,i){m.visible=vis[i];});ceilingGroup.visible=prev;
        var u=new Uint8Array(buf),s='',CH=0x8000;
        for(var i=0;i<u.length;i+=CH){s+=String.fromCharCode.apply(null,u.subarray(i,i+CH));}
        res(btoa(s));
      },function(e){rej(e);},{binary:true,onlyVisible:true,maxTextureSize:1024});
    });
  }
};

walkIn();
frame();
})();
</script>
